# Cloud Run runtime env vars for Thulir — template.
#
# Copy to `env-vars.yaml` (gitignored — never commit real values) and fill in real secrets, then:
#   gcloud run deploy thulir --source . --region asia-south1 \
#     --env-vars-file deploy/env-vars.yaml \
#     --build-env-vars VITE_AI_TRANSPORT=server
